site_name: Modul Kecerdasan Buatan
site_url: https://ismailrusli.github.io/modul_ai
theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - modul1.md
  - modul2.md
  - modul3.md
  - modul4.md
  - modul5.md
  - modul6.md
  - modul7.md
  - modul8.md
  - modul9.md
  - modul10.md
      
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
