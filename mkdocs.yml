site_name: Modul Kecerdasan Buatan
site_url: https://ismailrusli.github.io/modul_ai
theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Modul 1: modul1.md
  - Modul 2: modul2.md
  - Modul 3: modul3.md
  - Modul 4: modul4.md
  - Modul 5: modul5.md
  - Modul 6: modul6.md
  - Modul 7: modul7.md
  - Modul 8: modul8.md
      
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
